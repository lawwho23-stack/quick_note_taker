<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick Note popup, frosted light</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 880px; height: 400px; overflow: hidden; background: #DDE2EA; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif; color: #14161C">
  <div style="position: absolute; left: 40px; top: 22px; width: 120px; height: 12px; border-radius: 6px; background: #C3CAD6"></div>
  <div style="position: absolute; left: 176px; top: 22px; width: 64px; height: 12px; border-radius: 6px; background: #CDD3DD"></div>
  <div style="position: absolute; right: 40px; top: 18px; width: 20px; height: 20px; border-radius: 10px; background: #C3CAD6"></div>
  <div style="position: absolute; left: 60px; top: 130px; width: 760px; height: 300px; border-radius: 14px; background: #2A3142; display: flex; align-items: center; justify-content: center">
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#FFFFFF" fill-opacity="0.16"></circle><path d="M26 20l20 12-20 12z" fill="#FFFFFF" fill-opacity="0.85"></path></svg>
  </div>
  <div style="position: absolute; left: 160px; top: 44px; width: 560px; box-sizing: border-box; padding: 16px 20px 14px; border-radius: 18px; background: rgba(255,255,255,0.74); backdrop-filter: blur(28px) saturate(180%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 24px 60px rgba(20,30,60,0.28), 0 2px 6px rgba(20,30,60,0.12)">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F5FE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"></path><path d="M14 7l3 3"></path></svg>
      <span style="font-size: 13px; font-weight: 600; color: #3F4452">Quick Note</span>
    </div>
    <textarea aria-label="Your note" rows="3" style="display: block; width: 100%; box-sizing: border-box; border: 0; outline: 0; background: transparent; resize: none; font-family: inherit; font-size: 20px; line-height: 1.4; color: #14161C; padding: 0; height: 84px">Video idea: 3 mistakes beginners make with Claude Code, and the one-line fix for each</textarea>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(20,22,28,0.1)">
      <div style="display: flex; align-items: center; gap: 14px; font-size: 12px; color: #4A4F5C">
        <span style="display: inline-flex; align-items: center; gap: 6px"><kbd style="display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 6px; background: rgba(20,22,28,0.07); border: 1px solid rgba(20,22,28,0.1); font-family: inherit; font-size: 12px; color: #3A3F4C">↵</kbd>Save</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><kbd style="display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 6px; background: rgba(20,22,28,0.07); border: 1px solid rgba(20,22,28,0.1); font-family: inherit; font-size: 12px; color: #3A3F4C">⇧ ↵</kbd>New line</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><kbd style="display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 6px; background: rgba(20,22,28,0.07); border: 1px solid rgba(20,22,28,0.1); font-family: inherit; font-size: 12px; color: #3A3F4C">esc</kbd>Close</span>
      </div>
      <button type="button" style="height: 32px; padding: 0 16px; border: 0; border-radius: 9px; background: #1F5FE0; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Save</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":400}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
