<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Quick Note</title>
    <script type="module" src="./src/capture/capture.ts"></script>
  </head>
  <body>
    <main class="card" id="card">
      <header class="head">
        <svg class="pencil" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z" />
          <path d="M14 7l3 3" />
        </svg>
        <span class="title">Quick Note</span>
      </header>

      <div class="editor-wrap">
        <div class="mirror" id="mirror" aria-hidden="true"></div>
        <textarea
          id="editor"
          rows="3"
          placeholder="Type a thought…"
          aria-label="Note"
          spellcheck="true"
          autocomplete="off"
        ></textarea>
      </div>

      <footer class="foot">
        <div class="hints" id="hints">
          <span class="hint"><kbd>↵</kbd>Save</span>
          <span class="hint"><kbd>⇧</kbd><kbd>↵</kbd>New line</span>
          <span class="hint"><kbd>-</kbd><kbd>␣</kbd>Checklist</span>
          <span class="hint"><kbd>⌘</kbd><kbd>↵</kbd>Done</span>
          <span class="hint"><kbd>esc</kbd>Close</span>
        </div>
        <div class="status" id="status" role="status" aria-live="polite" hidden>
          <span id="status-msg"></span>
          <a id="setup-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Connect Quick Note</a>
        </div>
        <button type="button" class="save" id="save">Save</button>
      </footer>
    </main>
  </body>
</html>
