<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Quick Note — capture (M0)</title>
  <style>
    /* M0 capture window, styled to the "Frosted light" design.
       Spec: docs/design/frosted-light/popup-spec.md

       Note: a Chrome popup window is opaque — backdrop-filter can only
       blur what is inside this window. The body therefore paints a soft
       light gradient that stands in for the mockup's desktop scenery. */
    :root {
      color-scheme: light;
      --ink: #14161c;
      --heading: #3f4452;
      --muted: #4a4f5c;
      --kbd-ink: #3a3f4c;
      --accent: #1f5fe0;
      --hairline: rgba(20, 22, 28, 0.1);
      --chip-bg: rgba(20, 22, 28, 0.07);
      --card-bg: rgba(255, 255, 255, 0.74);
      --card-edge: rgba(255, 255, 255, 0.8);
      --card-shadow: 0 24px 60px rgba(20, 30, 60, 0.28), 0 2px 6px rgba(20, 30, 60, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      padding: 10px;
      display: flex;
      color: var(--ink);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(130% 120% at 20% 0%, #eef1f6 0%, rgba(238, 241, 246, 0) 55%),
                  linear-gradient(180deg, #e4e8ef 0%, #d6dbe4 100%);
    }
    .card {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 14px;
      border-radius: 18px;
      background: var(--card-bg);
      backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--card-edge);
      box-shadow: var(--card-shadow);
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    header .logo { flex: none; color: var(--accent); }
    header .title { font-size: 13px; font-weight: 600; color: var(--heading); }
    textarea {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      font-family: inherit;
      font-size: 20px;
      line-height: 1.4;
      color: var(--ink);
    }
    textarea::placeholder { color: rgba(20, 22, 28, 0.35); }
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--hairline);
    }
    .hints {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    .hints span { display: inline-flex; align-items: center; gap: 6px; }
    kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 6px;
      background: var(--chip-bg);
      border: 1px solid var(--hairline);
      font-family: inherit;
      font-size: 12px;
      line-height: 1;
      color: var(--kbd-ink);
    }
    .save {
      flex: none;
      height: 32px;
      padding: 0 16px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .save:disabled { opacity: 0.45; cursor: default; }
    .diag {
      margin-top: 6px;
      min-height: 14px;
      font-size: 11px;
      color: rgba(74, 79, 92, 0.75);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .note { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <svg class="logo" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"></path>
        <path d="M14 7l3 3"></path>
      </svg>
      <span class="title">Quick Note</span>
    </header>
    <textarea id="editor" aria-label="Your note" placeholder="Type your note…" autofocus></textarea>
    <footer>
      <div class="hints">
        <span><kbd>↵</kbd>Save</span>
        <span><kbd>⇧ ↵</kbd>New line</span>
        <span><kbd>esc</kbd>Close</span>
      </div>
      <button type="button" class="save" disabled title="Saving arrives in M4 — this is still the M0 bridge test">Save</button>
    </footer>
    <div id="status" class="diag">Opened via: <b id="trigger">?</b></div>
  </div>
  <script src="capture.js"></script>
</body>
</html>
